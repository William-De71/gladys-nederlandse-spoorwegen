<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Nederlandse Spoorwegen integration for Gladys Assistant
       (illustration, not the logo of NS): a yellow double-deck Intercity on a
       Dutch polder, with a departure board. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f7"/>
      <stop offset="1" stop-color="#f4f9fd"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ccc6a"/>
      <stop offset="1" stop-color="#6fae45"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <!-- a windmill on the horizon -->
  <g transform="translate(690 250)" fill="#4a5a6a">
    <path d="M-14 0 L-8 -70 L8 -70 L14 0 Z"/>
    <g transform="translate(0 -68) rotate(20)">
      <rect x="-3" y="-60" width="6" height="120"/>
      <rect x="-60" y="-3" width="120" height="6"/>
      <rect x="3" y="-58" width="14" height="50" fill="#e8eef3" stroke="#4a5a6a" stroke-width="2"/>
      <rect x="-17" y="8" width="14" height="50" fill="#e8eef3" stroke="#4a5a6a" stroke-width="2"/>
      <rect x="8" y="3" width="50" height="14" fill="#e8eef3" stroke="#4a5a6a" stroke-width="2"/>
      <rect x="-58" y="-17" width="50" height="14" fill="#e8eef3" stroke="#4a5a6a" stroke-width="2"/>
    </g>
  </g>
  <rect y="250" width="800" height="284" fill="url(#field)"/>
  <!-- a canal -->
  <path d="M0 470 C200 455 420 485 800 462 L800 490 C420 512 200 482 0 498 Z" fill="#6fa8d6"/>
  <!-- the track -->
  <rect y="402" width="800" height="10" fill="#6b6b6b"/>
  <g fill="#8a6a4a">
    <rect x="10" y="412" width="40" height="6"/><rect x="80" y="412" width="40" height="6"/>
    <rect x="150" y="412" width="40" height="6"/><rect x="220" y="412" width="40" height="6"/>
    <rect x="290" y="412" width="40" height="6"/><rect x="360" y="412" width="40" height="6"/>
    <rect x="430" y="412" width="40" height="6"/><rect x="500" y="412" width="40" height="6"/>
    <rect x="570" y="412" width="40" height="6"/><rect x="640" y="412" width="40" height="6"/>
    <rect x="710" y="412" width="40" height="6"/>
  </g>
  <!-- a yellow double-deck train -->
  <g>
    <path d="M60 300 H560 Q610 300 625 340 L640 396 H60 Z" fill="#ffc917" stroke="#1d2a44" stroke-width="3"/>
    <rect x="60" y="384" width="580" height="12" fill="#003082"/>
    <g fill="#1d2a44">
      <rect x="85" y="314" width="60" height="26" rx="4"/><rect x="160" y="314" width="60" height="26" rx="4"/>
      <rect x="235" y="314" width="60" height="26" rx="4"/><rect x="310" y="314" width="60" height="26" rx="4"/>
      <rect x="385" y="314" width="60" height="26" rx="4"/><rect x="460" y="314" width="60" height="26" rx="4"/>
      <rect x="85" y="350" width="60" height="24" rx="4"/><rect x="160" y="350" width="60" height="24" rx="4"/>
      <rect x="235" y="350" width="60" height="24" rx="4"/><rect x="310" y="350" width="60" height="24" rx="4"/>
      <rect x="385" y="350" width="60" height="24" rx="4"/><rect x="460" y="350" width="60" height="24" rx="4"/>
      <path d="M545 314 H575 Q600 316 610 346 H545 Z"/>
    </g>
    <circle cx="120" cy="404" r="9" fill="#333"/><circle cx="160" cy="404" r="9" fill="#333"/>
    <circle cx="520" cy="404" r="9" fill="#333"/><circle cx="560" cy="404" r="9" fill="#333"/>
  </g>
  <!-- the departure board -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="40" y="36" width="560" height="200" rx="14" fill="#003082"/>
    <text x="64" y="84" font-size="34" font-weight="bold" fill="#ffffff">Nederlandse Spoorwegen</text>
    <text x="64" y="118" font-size="18" fill="#ffc917">for Gladys Assistant</text>
    <g font-size="20" fill="#ffffff">
      <text x="64" y="160">09:24</text><text x="140" y="160">IC Venlo</text>
      <text x="470" y="160" fill="#ffc917">+8</text><text x="530" y="160">15</text>
      <text x="64" y="192">09:27</text><text x="140" y="192">SPR Driebergen</text>
      <text x="530" y="192">15</text>
      <text x="64" y="224">09:28</text><text x="140" y="224">IC Den Haag C.</text>
      <text x="530" y="224">8</text>
    </g>
  </g>
</svg>
